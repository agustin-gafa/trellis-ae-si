---
- name: Check the committed theme builds are not older than their source
  ansible.builtin.script: "{{ playbook_dir }}/bin/check-built-assets.sh {{ project_source_path }}"
  register: built_assets_check
  changed_when: false

- name: Show the result of the build check
  ansible.builtin.debug:
    msg: "{{ built_assets_check.stdout_lines }}"
