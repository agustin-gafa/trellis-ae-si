wordpress_sites:
  swedishinstitute.edu:
    site_hosts:
    # Lo ajusto para que quede como prioridad al crear el .env al desplegar,
    # cuando hay mas host no va bien
      - canonical: info.swedishinstitute.edu
      # - canonical: staging-si.rockinmedia.space
      # - canonical: info.staging-si.rockinmedia.space
      # Un host solo entra aqui cuando su DNS ya apunta a este servidor: Let's
      # Encrypt valida por HTTP y, si el dominio resuelve a otro sitio, la
      # emision falla y aborta el aprovisionamiento entero.
    local_path: ../site-swedishinstitute
    branch: main
    repo: git@github.com-si:agustin-gafa/swedishinstitute.git
    multisite:
      enabled: true
      subdomains: true
    env:
      multisite: true
      wp_allow_multisite: true
      subdomain_install: true
      path_current_site: /
      site_id_current_site: 1
      blog_id_current_site: 1
      # FluentSMTP lee la clave y el dominio de Mailgun como constantes; sin
      # ellos la peticion sale contra una URL incompleta y no se manda ni un correo.
      mailgun_domain: send.swedishinstitute.edu
    ssl:
      enabled: true
      provider: letsencrypt
    cache:
      enabled: false

  aeinstitute.net:
    # El primer canonical es el que Trellis escribe en WP_HOME y WP_SITEURL del
    # .env, y de ahi salen plugins_url(), content_url() y el URI del tema: es
    # decir, todo el CSS, el JS y las fuentes. Por eso va el dominio real y no
    # el host de trabajo, y por eso el orden no es cosmetico.
    site_hosts:
      - canonical: info.aeinstitute.net
    # - canonical: staging-ae.rockinmedia.space
    # - canonical: info.staging-ae.rockinmedia.space
    local_path: ../site-aeinstitute
    branch: main
    repo: git@github.com-ae:agustin-gafa/aeinstitute.git
    multisite:
      enabled: true
      subdomains: true
    env:
      multisite: true
      wp_allow_multisite: true
      subdomain_install: true
      path_current_site: /
      site_id_current_site: 1
      blog_id_current_site: 1
      # FluentSMTP lee la clave y el dominio de Mailgun como constantes; sin
      # ellos la peticion sale contra una URL incompleta y no se manda ni un correo.
      mailgun_domain: mg.aeinstitute.net
    ssl:
      enabled: true
      provider: letsencrypt
    cache:
      enabled: false