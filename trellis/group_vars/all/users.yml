# Documentation: https://roots.io/trellis/docs/ssh-keys/
admin_user: admin

# Also define 'vault_users' (`group_vars/staging/vault.yml`, `group_vars/production/vault.yml`)
users:
  - name: "{{ web_user }}"
    groups:
      - "{{ web_group }}"
    keys:
      - "{{ lookup('file', '~/.ssh/id_rsa.pub', errors='ignore') }}"
      - "{{ lookup('file', '~/.ssh/id_ed25519.pub', errors='ignore') }}"
      # - https://github.com/username.keys
      - https://github.com/j4rk0r.keys
      - https://github.com/juanpagotto.keys
      - https://github.com/agustin-gafa.keys
      - https://github.com/mcordoba.keys
  - name: "{{ admin_user }}"
    groups:
      - sudo
    keys:
      - "{{ lookup('file', '~/.ssh/id_rsa.pub', errors='ignore') }}"
      - "{{ lookup('file', '~/.ssh/id_ed25519.pub', errors='ignore') }}"
      # - https://github.com/username.keys
      - https://github.com/j4rk0r.keys
      - https://github.com/juanpagotto.keys
      - https://github.com/agustin-gafa.keys
      - https://github.com/mcordoba.keys

web_user: web
web_group: www-data
web_sudoers:
  - "/usr/sbin/service php{{ php_version }}-fpm *"

# SSH host aliases written to the web user's ~/.ssh/config. The deploy clones
# each site through its own alias so that each repository is reached with its
# own deploy key, and until now those entries existed only on the server.
#
# The private keys stay off the repository, which is public. They are placed by
# hand at the paths below, once per server, and their public halves are added
# as deploy keys on the matching GitHub repository.
web_ssh_host_aliases:
  - host: github.com-si
    hostname: github.com
    user: git
    identity_file: ~/.ssh/deploy_key_si
  - host: github.com-ae
    hostname: github.com
    user: git
    identity_file: ~/.ssh/deploy_key_ae
