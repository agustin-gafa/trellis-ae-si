wordpress_sites:
  swedishinstitute.edu:
    site_hosts:
      - canonical: staging-si.rockinmedia.space
      - canonical: info.staging-si.rockinmedia.space
    # local_path lo espera Trellis, pero no lo lee ningun playbook: solo sale en
    # los ejemplos comentados de deploy-hooks/build-before.yml. El codigo del
    # sitio se clona aparte y el despliegue lo trae con git pull EN EL SERVIDOR.
    local_path: ../site-swedishinstitute
    branch: develop
    repo: git@github.com:agustin-gafa/swedishinstitute.git
    multisite:
      enabled: true
      subdomains: true
    env:
      multisite: true
      wp_allow_multisite: true
      subdomain_install: true
      path_current_site: /
      site_id_current_site: 1
      blog_id_current_site: 1
      # Modo ensayo de la tuberia de leads. Fuera de produccion la bandera
      # intercepta TODOS los envios a los CRM, sin necesidad de marca en el
      # cuerpo: PRE es donde se prueba y donde entra el cliente a revisar, asi
      # que ningun formulario enviado aqui puede postear un lead real y
      # facturable.
      rockin_crm_dry_run: true

      mailgun_domain: send.swedishinstitute.edu
    ssl:
      enabled: true
      provider: letsencrypt
    cache:
      enabled: false

  aeinstitute.net:
    site_hosts:
      - canonical: staging-ae.rockinmedia.space
      - canonical: info.staging-ae.rockinmedia.space
    # Ver la nota de local_path de arriba.
    local_path: ../site-aeinstitute
    branch: develop
    repo: git@github.com:agustin-gafa/aeinstitute.git
    multisite:
      enabled: true
      subdomains: true
    env:
      multisite: true
      wp_allow_multisite: true
      subdomain_install: true
      path_current_site: /
      site_id_current_site: 1
      blog_id_current_site: 1
      # Modo ensayo de la tuberia de leads. Fuera de produccion la bandera
      # intercepta TODOS los envios a los CRM, sin necesidad de marca en el
      # cuerpo: PRE es donde se prueba y donde entra el cliente a revisar, asi
      # que ningun formulario enviado aqui puede postear un lead real y
      # facturable.
      rockin_crm_dry_run: true

      mailgun_domain: mg.aeinstitute.net
    ssl:
      enabled: true
      provider: letsencrypt
    cache:
      enabled: false